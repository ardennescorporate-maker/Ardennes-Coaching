# Supabase CLI config for `supabase start` (local development).
# Hosted projects: mirror these settings in the dashboard (see README → Production checklist).
project_id = "studypilot"

[api]
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600
max_frequency = "30s"

[auth.email.template.confirmation]
subject = "Your StudyPilot code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your StudyPilot password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Your StudyPilot login code"
content_path = "./supabase/templates/magic_link.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.external.apple]
enabled = false
